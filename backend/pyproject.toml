[project]
name = "opsassist"
version = "0.1.0"
description = "Auditable AI operations assistant: permission-aware RAG, controlled tools, approvals."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "anyio>=4.5",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mcp>=2.3,<3",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pypdf>=5.1",
    "python-multipart>=0.0.20",
    "referencing>=0.35",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[project.scripts]
opsassist = "opsassist.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live_model: requires a local Ollama daemon; deselected by default",
    "live_github: requires a real GitHub App, see docs/GITHUB_SETUP.md; deselected by default",
    "live_gmail: requires a real Google sign-in, see docs/GMAIL_SETUP.md; deselected by default",
]
addopts = "-m 'not live_model and not live_github and not live_gmail'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "ASYNC240"]
"evals/**" = ["S101", "S603", "ASYNC221"]
"migrations/**" = ["S608"]
# SQL fragments here are module constants. All values are bound parameters.
"src/opsassist/knowledge/retrieval.py" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "pypdf.*", "anthropic.*"]
ignore_missing_imports = true
